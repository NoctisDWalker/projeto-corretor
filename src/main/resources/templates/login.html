<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4C6EF5, #6A82FB);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 350px;
            border-radius: 15px;
            padding: 30px;
            background: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .login-card h3 {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-login {
            background: #4C6EF5;
            border: none;
        }

        .btn-login:hover {
            background: #3b5bdb;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center">Entrar</h3>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label">Úsuario</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu login" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-login w-100 text-white">Login</button>
    </form>
    <br />
    <hr />
    <a th:href="@{/oauth2/authorization/google}" class="btn btn-login w-100 text-white">Entrar com Google</a>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
