spring:
  application:
    name: corretor-aux
  datasource:
      url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/corretor_db}
      username: ${DATASOURCE_USERNAME:postgres}
      password: ${DATASOURCE_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
app:
  security:
    rsa-keys-private: ${PRIVATE_KEY_PATH:/home/prometeu/Projetos/Pessoais/projeto-corretor/keys/private.pem}
    rsa-keys-public: ${PUBLIC_KEY_PATH:/home/prometeu/Projetos/Pessoais/projeto-corretor/keys/public.pem}
    rsa-keys-id: ${KEY_ID_PATH:/home/prometeu/Projetos/Pessoais/projeto-corretor/keys/key-id.txt}